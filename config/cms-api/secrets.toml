# ./scripts/install.nu collects these values using hidden prompts and saves mode 600.
# Changing this value does not rotate an existing database password.
[database]
password = "{{main_database_password}}"

[demo.database]
password = "{{demo_database_password}}"

[storage]
accessKeyId = "{{s3_access_key_id}}"
secretAccessKey = "{{s3_secret_access_key}}"
# sessionToken = ""

# Set the header names and values required by each OTLP destination.
# Sentry traces/logs use: "x-sentry-auth" = "sentry sentry_key=YOUR_PUBLIC_KEY"
[telemetry.traces.headers]
"x-sentry-auth" = "{{sentry_auth_header}}"

[telemetry.metrics.headers]
"Authorization" = "{{metrics_auth_header}}"

[telemetry.logs.headers]
"x-sentry-auth" = "{{sentry_auth_header}}"
